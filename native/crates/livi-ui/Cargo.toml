[package]
name = "livi-ui"
version.workspace = true
edition.workspace = true
description.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "LIVI"
path = "src/main.rs"

[dependencies]
base64.workspace = true
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc.workspace = true
livi-core-client.workspace = true
livi-core-proto.workspace = true
livi-ui-model.workspace = true
raw-window-handle = "0.6.2"
serde_json.workspace = true
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "renderer-femtovg",
    "renderer-software",
    "raw-window-handle-06",
    "unstable-winit-030",
] }

[target.'cfg(target_os = "macos")'.dependencies]
livi-video-view.workspace = true

[features]
# Skia instead of FemtoVG for drawing; Slint picks Skia when both are built in (SLINT_BACKEND=winit-femtovg goes back).
# Measured on a PowerVR GE8300 (Allwinner A133) at 2400x900: about a quarter less GPU time a frame. Makes the binary
# about 12 MB larger, and skia-bindings downloads Skia's prebuilt libraries while building.
skia = ["slint/renderer-skia-opengl"]

[build-dependencies]
slint-build = "1.18.1"
